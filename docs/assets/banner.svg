<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="40%" stop-color="#FDF2F8" />
      <stop offset="80%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>
    
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.12" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <circle cx="200" cy="80" r="140" fill="#FECDD3" opacity="0.45" filter="url(#softGlow)" />
  <circle cx="1020" cy="180" r="180" fill="#DDD6FE" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="600" cy="320" r="120" fill="#FBCFE8" opacity="0.35" filter="url(#softGlow)" />

  <!-- Glass Center Card -->
  <g filter="url(#glassShadow)">
    <rect x="80" y="40" width="1040" height="280" rx="32" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Interlocking Hearts Emblem -->
  <g transform="translate(140, 95)">
    <!-- Heart 1 -->
    <path d="M 45 20 A 20 20 0 0 0 10 45 C 10 75 45 105 45 105 C 45 105 80 75 80 45 A 20 20 0 0 0 45 20 Z" 
          fill="url(#heartGrad)" opacity="0.9" />
    <!-- Heart 2 (Intertwined) -->
    <path d="M 75 25 A 18 18 0 0 0 42 48 C 42 75 75 100 75 100 C 75 100 108 75 108 48 A 18 18 0 0 0 75 25 Z" 
          fill="none" stroke="#C084FC" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <!-- Sparkles -->
    <circle cx="15" cy="18" r="3" fill="#F43F5E" />
    <circle cx="105" cy="20" r="2.5" fill="#C084FC" />
    <circle cx="115" cy="80" r="3.5" fill="#FB7185" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(300, 115)">
    <!-- Pill Badge -->
    <rect x="0" y="-30" width="220" height="28" rx="14" fill="#FCE7F3" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1" />
    <text x="24" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E11D48" letter-spacing="1">
      PRIVATE DIGITAL SANCTUARY
    </text>

    <!-- Main Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#1C1917" letter-spacing="-1">
      OURSPACE
    </text>

    <!-- Tagline -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#78716C">
      Two Hearts. <tspan fill="url(#roseGlow)">One Private Digital World.</tspan>
    </text>

    <!-- Subtitle / Spec -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A29E">
      Encrypted Couple Pairing • WebRTC LiveKit HD Calls • Real-Time Firestore • Shared Milestones
    </text>
  </g>

  <!-- Right Side Decorative Status Badge -->
  <g transform="translate(860, 95)" filter="url(#glassShadow)">
    <rect width="210" height="170" rx="24" fill="#FFFFFF" fill-opacity="0.9" stroke="#FECDD3" stroke-width="1.5" />
    
    <!-- Status Dot & Title -->
    <circle cx="32" cy="38" r="5" fill="#10B981" />
    <circle cx="32" cy="38" r="9" fill="#10B981" fill-opacity="0.25" />
    <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">
      STRICT 2-PERSON
    </text>

    <text x="26" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#1C1917">
      100%
    </text>
    <text x="100" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#78716C">
      Private Space
    </text>

    <!-- Micro pills -->
    <rect x="24" y="105" width="162" height="1" fill="#F5F5F4" />
    
    <text x="26" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F43F5E">
      ♥ Audio &amp; Video SFU
    </text>
    <text x="26" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B5CF6">
      ★ Zero Public Feed
    </text>
  </g>
</svg>
