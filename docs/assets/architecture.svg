<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="520">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>

    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="20" fill="#FAF8F5" />

  <!-- Section 1: Clients -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <rect width="260" height="440" rx="16" fill="url(#cardBg)" stroke="#FECDD3" stroke-width="1.5" />
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#FCE7F3" />
    <text x="32" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E11D48">CLIENT TIER</text>
    
    <!-- Partner A Card -->
    <rect x="20" y="60" width="220" height="85" rx="12" fill="#FFFFFF" stroke="#FEE2E2" />
    <circle cx="45" cy="95" r="14" fill="#F43F5E" />
    <text x="41" y="99" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">A</text>
    <text x="70" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1917">Partner A</text>
    <text x="70" y="106" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Next.js 14 PWA (Web)</text>
    <text x="70" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981" font-weight="600">● 5G / Home Broadband</text>

    <!-- Partner B Card -->
    <rect x="20" y="160" width="220" height="85" rx="12" fill="#FFFFFF" stroke="#EDE9FE" />
    <circle cx="45" cy="195" r="14" fill="#8B5CF6" />
    <text x="41" y="199" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">B</text>
    <text x="70" y="190" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1917">Partner B</text>
    <text x="70" y="206" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Expo Mobile (iOS/Android)</text>
    <text x="70" y="222" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981" font-weight="600">● LTE / Public Wi-Fi</text>

    <!-- Shared Store Card -->
    <rect x="20" y="260" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="285" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#44403C">Client Architecture</text>
    <text x="35" y="310" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">✓ Zustand Modular Stores</text>
    <text x="35" y="330" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">✓ Web Audio Synthesizer</text>
    <text x="35" y="350" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">✓ FIFO Offline Queue</text>
    <text x="35" y="370" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">✓ Tailwind Romantic Glass</text>
    <text x="35" y="390" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">✓ Zod Runtime Validation</text>
  </g>

  <!-- Connectors from Clients to Cloud -->
  <path d="M 300 135 L 370 135" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 300 235 L 370 235" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Section 2: Google Firebase Backend Services -->
  <g transform="translate(370, 40)" filter="url(#shadow)">
    <rect width="280" height="440" rx="16" fill="url(#cardBg)" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="20" y="20" width="170" height="24" rx="6" fill="#FEF3C7" />
    <text x="30" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#B45309">GOOGLE FIREBASE BACKEND</text>

    <!-- Service 1: Auth -->
    <rect x="20" y="60" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="84" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#D97706">Firebase Authentication</text>
    <text x="35" y="102" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Email/Password • Session Revocation</text>
    <text x="35" y="118" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">Strict 2-User Space Membership Check</text>

    <!-- Service 2: Cloud Firestore -->
    <rect x="20" y="140" width="240" height="85" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="164" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F43F5E">Cloud Firestore (Real-Time)</text>
    <text x="35" y="182" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">onSnapshot Subscriptions • Messages</text>
    <text x="35" y="198" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Presence Heartbeats • Reminders</text>
    <text x="35" y="214" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">Zero-Trust Rules • Composite Indexes</text>

    <!-- Service 3: Firebase Storage -->
    <rect x="20" y="235" width="240" height="75" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="259" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#8B5CF6">Firebase Cloud Storage</text>
    <text x="35" y="277" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Isolated /spaces/{spaceId}/* path</text>
    <text x="35" y="293" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">50MB Max • Whitelisted Media Types</text>

    <!-- Service 4: Cloud Functions v2 -->
    <rect x="20" y="320" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="344" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#059669">Cloud Functions v2 (Node 20)</text>
    <text x="35" y="362" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">onDocumentCreated: Enforce 2 Members</text>
    <text x="35" y="378" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">onSchedule: Automated Cron Reminders</text>
    <text x="35" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#059669">FCM Push Notification Dispatch</text>
  </g>

  <!-- Connectors to LiveKit & Vercel -->
  <path d="M 650 140 L 700 140" stroke="#059669" stroke-width="2" />
  <path d="M 650 320 L 700 320" stroke="#2563EB" stroke-width="2" />

  <!-- Section 3: LiveKit SFU & Vercel Hosting -->
  <g transform="translate(700, 40)" filter="url(#shadow)">
    <rect width="260" height="440" rx="16" fill="url(#cardBg)" stroke="#BFDBFE" stroke-width="1.5" />
    <rect x="20" y="20" width="180" height="24" rx="6" fill="#DBEAFE" />
    <text x="30" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">MEDIA &amp; DEPLOYMENT</text>

    <!-- LiveKit SFU -->
    <rect x="20" y="60" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="85" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563EB">LiveKit WebRTC Cloud</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Global Selective Forwarding Unit</text>
    <text x="35" y="125" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">WSS Signaling over SSL (Port 443)</text>
    <text x="35" y="145" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">STUN / TURN over TLS</text>
    <text x="35" y="165" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Adaptive Bitrate &amp; Simulcast</text>
    <text x="35" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">Bypasses Mobile CGNAT &amp; Firewalls</text>

    <!-- Vercel Production Hosting -->
    <rect x="20" y="230" width="220" height="180" rx="10" fill="#FFFFFF" stroke="#E7E5E4" />
    <text x="35" y="255" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#000000">Vercel Production Edge</text>
    <text x="35" y="275" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Global Edge Network</text>
    <text x="35" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Next.js 14 App Router SSR</text>
    <text x="35" y="315" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Serverless Token Route Handlers</text>
    <text x="35" y="335" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">Zero-Secret Client Bundles</text>
    <text x="35" y="355" font-family="-apple-system, sans-serif" font-size="11" fill="#78716C">HSTS, CSP &amp; Permissions Headers</text>
    <text x="35" y="375" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">CI/CD Continuous Deployment</text>
  </g>
</svg>
